services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: srm_tracker
      POSTGRES_USER: srm_tracker
      POSTGRES_PASSWORD: srm_tracker
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srm_tracker -d srm_tracker"]
      interval: 2s
      timeout: 5s
      retries: 15

  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_DB: srm_tracker_test
      POSTGRES_USER: srm_tracker
      POSTGRES_PASSWORD: srm_tracker
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srm_tracker -d srm_tracker_test"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
