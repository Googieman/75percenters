services:
  - type: web
    name: srm-attendance-api-staging
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: python -m pip install --requirement requirements.lock && python -m pip install . --no-deps
    preDeployCommand: python -m alembic upgrade head
    startCommand: python -m uvicorn srm_tracker.main:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: SRM_TRACKER_DATABASE_URL
        fromDatabase:
          name: srm-attendance-db-staging
          property: connectionString
      - key: SRM_TRACKER_ENVIRONMENT
        value: staging
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: SRM_TRACKER_FRONTEND_ORIGIN
        sync: false
      - key: SRM_TRACKER_SESSION_ENCRYPTION_KEY
        sync: false
      - key: SRM_TRACKER_SESSION_ENCRYPTION_KEY_VERSION
        value: "1"
      - key: SRM_TRACKER_SESSION_ENCRYPTION_READ_KEYS
        value: "{}"
      - key: SRM_TRACKER_SYNC_EXECUTION_MODE
        value: on_demand
      - key: SRM_TRACKER_ACQUISITION_ENABLED
        value: "false"
      - key: SRM_TRACKER_WEB_PUSH_PUBLIC_KEY
        sync: false
      - key: SRM_TRACKER_WEB_PUSH_PRIVATE_KEY
        sync: false
      - key: SRM_TRACKER_WEB_PUSH_SUBJECT
        sync: false

databases:
  - name: srm-attendance-db-staging
    plan: free
    region: oregon
    postgresMajorVersion: "16"
